services:
  verity:
    image: ghcr.io/saurabh4269/verity:latest
    container_name: verity
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - verity-data:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/verity.db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      HISTORY_ENABLED: ${HISTORY_ENABLED:-true}
      VULN_CHECK_ENABLED: ${VULN_CHECK_ENABLED:-true}
      NVD_API_KEY: ${NVD_API_KEY:-}

volumes:
  verity-data:
    driver: local
