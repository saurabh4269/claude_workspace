[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:backend]
command=/bin/sh -c "/opt/venv/bin/alembic upgrade head && /opt/venv/bin/uvicorn app.api.main:app --host 127.0.0.1 --port 8000"
environment=PATH="/opt/venv/bin:%(ENV_PATH)s",VIRTUAL_ENV="/opt/venv"
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
